<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F0E7" />
    <meta
      name="description"
      content="EcoPet — produtos sustentáveis e criativos para diferentes pets. Amor que cuida, escolhas que transformam."
    />
    <title>EcoPet · Amor que cuida</title>
    <link rel="icon" href="assets/logo-ecopet.png" />
  <!-- ESTILO DO SITE: cores e aparência -->
<style>
@font-face {
  font-family: "Lato";
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url(assets/lato-0.ttf) format("truetype");
}
@font-face {
  font-family: "Lato";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(assets/lato-1.ttf) format("truetype");
}
@font-face {
  font-family: "Lato";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url(assets/lato-2.ttf) format("truetype");
}
@font-face {
  font-family: "Lato";
  font-style: normal;
  font-weight: 900;
  font-display: swap;
  src: url(assets/lato-3.ttf) format("truetype");
}

:root {
  --cream: #f7f0e7;
  --soft: #aab28d;
  --eco: #5f7f2d;
  --earth: #7b5429;
  --deep: #314423;
  --aqua: #6e9e97;
  --white: #fff;
  --line: #dddccd;
  --font-size: 16px;
  --letter: normal;
  --word: normal;
  --leading: 1.65;
  color: var(--deep);
  background: var(--cream);
  font-family: Lato, Arial, sans-serif;
  font-size: var(--font-size);
  line-height: var(--leading);
  letter-spacing: var(--letter);
  word-spacing: var(--word);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a,
input,
select,
textarea {
  touch-action: manipulation;
}
a {
  color: inherit;
  text-underline-offset: 4px;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
img {
  max-width: 100%;
  display: block;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.58;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1,
h2,
h3 {
  line-height: 1.14;
  letter-spacing: -0.03em;
}
h1 {
  font-size: clamp(2.15rem, 4.6vw, 4.35rem);
  font-weight: 900;
  margin-bottom: 24px;
}
h2 {
  font-size: clamp(1.8rem, 3vw, 2.7rem);
  font-weight: 900;
}
h3 {
  font-size: 1.2rem;
  font-weight: 700;
}
p {
  margin-bottom: 1.1em;
}
svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
small,
.muted {
  font-size: 0.88rem;
  color: var(--earth);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip {
  position: fixed;
  top: -100px;
  left: 12px;
  z-index: 2000;
  background: white;
  padding: 12px;
}
.skip:focus {
  top: 12px;
}
:focus-visible {
  outline: 3px solid var(--earth);
  outline-offset: 4px;
}
button,
input,
select {
  min-height: 44px;
}
.container {
  width: min(1240px, calc(100% - 64px));
  margin: auto;
}
.section {
  padding: 64px 0;
}
.eyebrow {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-weight: 700;
  color: var(--earth);
  display: block;
  margin-bottom: 16px;
}
.lead {
  font-size: 1.15rem;
  max-width: 680px;
}
.environment {
  background: var(--soft);
  text-align: center;
  font-size: 0.76rem;
  padding: 7px 16px;
  letter-spacing: 0.025em;
}
.environment:empty {
  display: none;
}
header {
  background: var(--white);
  border-bottom: 1px solid var(--line);
}
.header-top {
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 16px 0;
}
.brand {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.brand img {
  width: 78px;
  height: 84px;
  object-fit: contain;
}
.search {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--cream);
  border: 1px solid transparent;
  border-radius: 30px;
  padding: 3px 6px 3px 20px;
}
.search input {
  min-width: 0;
  width: 100%;
  border: 0;
  background: none;
  outline-offset: 0;
}
.search button {
  border: 0;
  background: none;
  width: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}
.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.account-link {
  display: flex;
  gap: 10px;
  align-items: center;
  text-decoration: none;
  font-size: 0.86rem;
  font-weight: 700;
}
.account-link small {
  display: block;
  font-size: 0.72rem;
  font-weight: 400;
}
.icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: transparent;
  border: 1px solid transparent;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  text-decoration: none;
  position: relative;
}
.icon:hover {
  background: var(--cream);
}
.badge {
  position: absolute;
  top: 0;
  right: 0;
  font-size: 0.64rem;
  background: var(--eco);
  color: white;
  border-radius: 15px;
  min-width: 18px;
  padding: 0 4px;
}
.nav {
  display: flex;
  justify-content: center;
  gap: 36px;
  border-top: 1px solid var(--line);
  padding: 13px 0;
  font-size: 0.88rem;
}
.nav a {
  text-decoration: none;
  white-space: nowrap;
}
.nav a[aria-current="page"] {
  color: var(--eco);
  font-weight: 700;
}
.nav a:hover {
  text-decoration: underline;
}
.account-menu {
  position: relative;
}
.account-menu summary {
  list-style: none;
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
}
.account-menu nav {
  position: absolute;
  z-index: 20;
  right: 0;
  top: 50px;
  background: white;
  box-shadow: 0 12px 30px #31442320;
  border: 1px solid var(--line);
  border-radius: 16px;
  width: 210px;
  padding: 12px;
  display: grid;
}
.account-menu nav a,
.account-menu nav button {
  padding: 10px;
  border: 0;
  text-decoration: none;
  background: none;
  text-align: left;
}
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 48px;
  padding: 64px 0 56px;
}
.hero h1 {
  max-width: 610px;
}
.hero p {
  max-width: 470px;
  color: var(--earth);
}
.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  background: var(--eco);
  color: white;
  text-decoration: none;
  border: 1px solid var(--eco);
  border-radius: 28px;
  padding: 12px 23px;
  min-height: 48px;
  font-weight: 700;
  font-size: 0.9rem;
  line-height: 1.4;
}
.btn:hover {
  filter: brightness(0.94);
}
.btn.secondary {
  background: transparent;
  color: var(--deep);
  border-color: var(--soft);
}
.btn.light {
  background: white;
  color: var(--deep);
  border-color: white;
}
.btn.small {
  min-height: 44px;
  padding: 9px 16px;
}
.hero-collage {
  display: grid;
  grid-template-columns: 1.05fr 0.8fr;
  gap: 14px;
  align-items: center;
  position: relative;
  padding-bottom: 28px;
}
.hero-collage img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-radius: 30px;
}
.hero-collage .tall {
  height: 390px;
  grid-row: span 2;
  border-radius: 100px 100px 30px 30px;
}
.hero-collage .short {
  height: 170px;
}
.hero-seal {
  position: absolute;
  bottom: 0;
  left: 12%;
  background: white;
  border: 1px solid var(--line);
  box-shadow: 0 8px 20px #3144230d;
  padding: 14px 22px;
  border-radius: 18px;
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 0.82rem;
}
.hero-seal svg {
  color: var(--eco);
  width: 30px;
  height: 30px;
}
.hero-seal strong {
  display: block;
}
.values-strip {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding: 24px 0;
  gap: 28px;
}
.value {
  display: flex;
  gap: 14px;
  align-items: center;
  font-size: 0.86rem;
}
.value svg {
  color: var(--eco);
  width: 30px;
  height: 30px;
}
.value strong {
  display: block;
}
.value span {
  color: var(--earth);
  font-size: 0.8rem;
}
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}
.section-head h2 {
  margin: 0;
}
.text-link {
  font-weight: 700;
  font-size: 0.88rem;
  white-space: nowrap;
}
.animal-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 12px;
}
.animal {
  background: white;
  text-decoration: none;
  border-radius: 20px;
  padding: 18px 8px;
  text-align: center;
  border: 1px solid var(--line);
  font-size: 0.76rem;
  display: grid;
  justify-items: center;
  gap: 8px;
}
.animal span {
  font-size: 2rem;
  line-height: 1.2;
}
.animal:hover {
  background: #eef0e6;
  border-color: var(--eco);
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
}
.product {
  border: 1px solid var(--line);
  border-radius: 23px;
  background: white;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.product-media {
  position: relative;
  background: #eee9df;
}
.product-media > a {
  display: block;
}
.product-media img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  transition: transform 0.3s;
}
.product-media {
  overflow: hidden;
}
.product:hover .product-media img {
  transform: scale(1.035);
}
.favorite {
  position: absolute;
  right: 12px;
  top: 12px;
  background: white;
  border: 0;
  box-shadow: 0 3px 8px #31442312;
}
.favorite[aria-pressed="true"] {
  color: var(--earth);
  background: var(--cream);
}
.product-info {
  padding: 22px;
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 12px;
}
.product-info .eyebrow {
  font-size: 0.64rem;
  letter-spacing: 0.12em;
  margin: 0;
}
.product-info h3 {
  font-size: 1.04rem;
  margin: 0;
  line-height: 1.4;
  min-height: 2.8em;
}
.product-info h3 a {
  text-decoration: none;
}
.product-info small {
  font-size: 0.73rem;
}
.price {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--deep);
}
.product-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
}
.product-info > .btn {
  width: 100%;
}
.story {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: center;
}
.story-art {
  background: var(--soft);
  border-radius: 26px;
  min-height: 390px;
  display: grid;
  place-items: center;
  padding: 44px;
}
.story-art img {
  width: 240px;
  background: white;
  border-radius: 24px;
  padding: 18px;
}
.story .eyebrow {
  margin-bottom: 14px;
}
.eco-banner {
  border-radius: 28px;
  background: var(--soft);
  padding: 45px;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 50px;
  align-items: center;
}
.eco-banner h2 {
  margin-bottom: 18px;
}
.eco-banner p {
  max-width: 650px;
}
.eco-art {
  font-size: 6rem;
  text-align: center;
  opacity: 0.7;
}
.pill {
  font-size: 0.76rem;
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--cream);
  display: inline-block;
  margin-bottom: 10px;
}
.panel {
  background: white;
  border: 1px solid var(--line);
  padding: 28px;
  border-radius: 22px;
}
.panels {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.panels > .panel:nth-child(3n + 2) {
  background: #e5e8d9;
}
.panels > .panel:nth-child(3n) {
  background: #e4eeeb;
}
.panel h3 {
  margin-bottom: 12px;
}
.empty {
  text-align: center;
  padding: 40px;
  border: 1px dashed var(--soft);
  border-radius: 20px;
  background: #ffffff70;
}
.empty h2 {
  font-size: 1.6rem;
}
.empty p {
  max-width: 550px;
  margin: 0 auto 22px;
}
.notice {
  padding: 16px 20px;
  border-left: 3px solid var(--eco);
  background: #e9eddf;
  border-radius: 0 12px 12px 0;
  margin: 20px 0;
  font-size: 0.9rem;
}
.error {
  color: #7b5429;
  border-color: #7b5429;
  background: #f7f0e7;
}
.error:empty {
  display: none;
}
footer {
  background: var(--deep);
  color: var(--cream);
  margin-top: 60px;
  padding: 50px 0 24px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr repeat(4, 1fr);
  gap: 30px;
}
.footer-grid img {
  width: 90px;
  background: white;
  padding: 8px;
  border-radius: 12px;
  margin-bottom: 16px;
}
.footer-grid h3 {
  font-size: 0.9rem;
  letter-spacing: 0;
}
.footer-grid p,
.footer-grid a {
  font-size: 0.8rem;
}
.footer-grid nav {
  display: grid;
  gap: 10px;
}
.footer-grid a {
  text-decoration: none;
}
.footer-grid a:hover {
  text-decoration: underline;
}
.footer-bottom {
  border-top: 1px solid #ffffff25;
  margin-top: 34px;
  padding-top: 22px;
  display: flex;
  justify-content: space-between;
  font-size: 0.74rem;
  gap: 20px;
}
.footer-bottom select {
  background: var(--cream);
  border: 0;
  border-radius: 8px;
  padding: 5px;
}
.breadcrumbs {
  font-size: 0.8rem;
  margin-bottom: 28px;
  color: var(--earth);
}
.catalog-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 32px;
}
.catalog-layout .grid {
  grid-template-columns: repeat(3, 1fr);
}
.filters {
  display: grid;
  gap: 18px;
  align-content: start;
  background: white;
  border: 1px solid var(--line);
  padding: 22px;
  border-radius: 20px;
}
.field {
  display: grid;
  gap: 7px;
  font-size: 0.88rem;
  font-weight: 700;
  min-width: 0;
}
.field input,
.field select,
.field textarea,
input.control,
select.control {
  width: 100%;
  border: 1px solid var(--soft);
  background: white;
  border-radius: 10px;
  padding: 10px 12px;
  min-width: 0;
  font-weight: 400;
}
.field textarea {
  min-height: 90px;
  resize: vertical;
}
.field small {
  font-weight: 400;
}
.form {
  display: grid;
  gap: 18px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.catalog-top {
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  font-size: 0.85rem;
}
.catalog-top select {
  max-width: 220px;
}
.detail {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 64px;
  align-items: start;
}
.detail h1 {
  font-size: clamp(2rem, 3vw, 3.1rem);
}
.detail .price {
  font-size: 2rem;
  margin: 18px 0;
}
.detail-photo {
  border: 0;
  padding: 0;
  border-radius: 28px;
  background: white;
  overflow: hidden;
  width: 100%;
  cursor: zoom-in;
}
.detail-photo img {
  width: 100%;
  max-height: 560px;
  object-fit: contain;
}
.thumbnails {
  display: flex;
  gap: 10px;
  margin: 12px 0;
}
.thumbnails button {
  width: 70px;
  padding: 0;
  border: 1px solid var(--soft);
  background: white;
  border-radius: 10px;
  overflow: hidden;
}
.detail-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: 50px;
}
.quantity {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--soft);
  border-radius: 25px;
  overflow: hidden;
  background: white;
}
.quantity button {
  border: 0;
  background: transparent;
  width: 42px;
  min-height: 44px;
}
.quantity input {
  width: 45px;
  text-align: center;
  border: 0;
  background: none;
  appearance: textfield;
}
.quantity input::-webkit-inner-spin-button {
  appearance: none;
}
.cart-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 35px;
}
.cart-row {
  display: grid;
  grid-template-columns: 100px 1fr auto;
  gap: 20px;
  align-items: center;
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
}
.cart-row img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 15px;
}
.cart-row h3 {
  font-size: 1rem;
  line-height: 1.4;
}
.cart-row p {
  margin-bottom: 8px;
  font-size: 0.85rem;
}
.cart-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.summary {
  height: fit-content;
  position: sticky;
  top: 20px;
}
.total-line {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 0.9rem;
  padding: 10px 0;
}
.total-line.big {
  border-top: 1px solid var(--line);
  font-size: 1.2rem;
  font-weight: 900;
  margin-top: 12px;
}
.auth {
  max-width: 510px;
  margin: 45px auto;
}
.auth > img {
  width: 100px;
  margin: 0 auto 22px;
}
.auth h1 {
  font-size: 2rem;
  text-align: center;
}
.auth .btn {
  width: 100%;
}
.password-wrap {
  display: flex;
  gap: 6px;
  align-items: center;
}
.password-wrap input {
  flex: 1;
  width: 100%;
}
.check {
  display: flex;
  gap: 10px;
  font-size: 0.85rem;
  align-items: start;
  font-weight: 400;
}
.check input {
  width: 20px;
  min-height: 20px;
  flex-shrink: 0;
  margin-top: 4px;
}
.steps {
  display: flex;
  list-style: none;
  padding: 0;
  gap: 12px;
  overflow: auto;
  margin: 0 0 35px;
}
.steps li {
  padding: 12px 18px;
  border: 1px solid var(--soft);
  border-radius: 24px;
  font-size: 0.8rem;
  white-space: nowrap;
}
.steps li.active {
  background: var(--deep);
  color: white;
}
.steps li.done {
  background: var(--soft);
}
.radio-card {
  display: flex;
  gap: 12px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
  align-items: center;
  cursor: pointer;
}
.radio-card input {
  width: 20px;
  flex-shrink: 0;
}
.radio-card:has(input:checked) {
  border: 2px solid var(--eco);
}
.radio-card span {
  flex: 1;
}
.radio-card small {
  display: block;
}
.timeline {
  list-style: none;
  padding: 0;
}
.timeline li {
  border-left: 2px solid var(--soft);
  padding: 0 0 25px 25px;
  position: relative;
}
.timeline li::before {
  content: "";
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--eco);
  position: absolute;
  left: -7px;
  top: 6px;
}
.timeline time {

  async function handleCheckoutForm(form) {
    const b = formData(form);
    if (form.id === "checkout-address") {
      checkout.addressId = b.addressId;
      const addresses2 = await api("/addresses"), a = addresses2.find((a2) => a2.id === b.addressId);
      checkout.quote = await api("/shipping/quote", "POST", {
        items: state.cart,
        cep: a.cep
      });
      checkout.step = 3;
      return true;
    }
    if (form.id === "checkout-delivery") {
      checkout.serviceId = b.serviceId;
      checkout.coupon = safeSession.getItem("ecopet-coupon") || "";
      checkout.preview = await api("/cart/preview", "POST", {
        items: state.cart,
        coupon: checkout.coupon
      });
      checkout.step = 4;
      return true;
    }
    if (form.id === "checkout-payment") {
      const request = {
        items: state.cart,
        addressId: checkout.addressId,
        quoteId: checkout.quote.id,
        serviceId: checkout.serviceId,
        coupon: checkout.coupon,
        method: b.method
      };
      const serialized = JSON.stringify(request), saved = load("ecopet-order-attempt", null);
      const attempt = saved?.request === serialized ? saved : { key: crypto.randomUUID(), request: serialized };
      save("ecopet-order-attempt", attempt);
      const order2 = await api("/orders", "POST", request, {
        "Idempotency-Key": attempt.key
      });
      state.cart = [];
      persistCart();
      save("ecopet-order-attempt", null);
      location.hash = "/pagar/" + order2.id;
      return true;
    }
    return false;
  }

  function stopGesture() {
    cancelAnimationFrame(frame);
    stream?.getTracks().forEach((t2) => t2.stop());
    stream = null;
    landmarker?.close();
    landmarker = null;
    lastY = null;
    const video = $("#gesture-video");
    if (video) {
      video.srcObject = null;
      video.hidden = true;
    }
    if ($("#gesture-status"))
      $("#gesture-status").textContent = "C\xE2mera desligada.";
  }
  async function startGesture() {
    if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) {
      $("#gesture-status").textContent = "Este navegador exige c\xE2mera compat\xEDvel e HTTPS (ou localhost). Use teclado, toque ou mouse.";
      return;
    }
    stopGesture();
    $("#gesture-status").textContent = "Carregando reconhecimento da m\xE3o\u2026";
    try {
      const { FilesetResolver, HandLandmarker } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs");
      const files = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );
      landmarker = await HandLandmarker.createFromOptions(files, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 },
        audio: false
      });
      const video = $("#gesture-video");
      video.srcObject = stream;
      video.hidden = false;
      await video.play();
      $("#gesture-status").textContent = "C\xE2mera ativa. Feche a m\xE3o para parar. Nenhuma imagem \xE9 gravada.";
      let lastTime = -1;
      const loop = () => {
        if (!stream || !landmarker) return;
        try {
          if (video.currentTime !== lastTime) {
            lastTime = video.currentTime;
            const hands = landmarker.detectForVideo(
              video,
              performance.now()
            ).landmarks;
            if (hands.length) {
              const hand = hands[0];
              const open = [8, 12, 16, 20].filter(
                (i) => Math.hypot(hand[i].x - hand[0].x, hand[i].y - hand[0].y) > Math.hypot(
                  hand[i - 2].x - hand[0].x,
                  hand[i - 2].y - hand[0].y
                ) * 1.15
              ).length >= 3;
              const y = hand[9].y;
              if (open && lastY !== null) {
                const delta = (y - lastY) * 1e3;
                if (Math.abs(delta) > 5)
                  window.scrollBy(0, Math.max(-45, Math.min(45, delta)));
              }
              lastY = open ? y : null;
            } else lastY = null;
          }
        } catch {
          stopGesture();
          return;
        }
        frame = requestAnimationFrame(loop);
      };
      frame = requestAnimationFrame(loop);
      $("#access-panel").close();
      const indicator = document.createElement("button");
      indicator.id = "camera-indicator";
      indicator.className = "btn";
      indicator.style.cssText = "position:fixed;bottom:80px;right:16px;z-index:80";
      indicator.textContent = "C\xE2mera ativa \xB7 Desligar";
      indicator.onclick = () => {
        stopGesture();
        indicator.remove();
      };
      document.body.append(indicator);
    } catch {
      stopGesture();
      $("#gesture-status").textContent = "N\xE3o foi poss\xEDvel ativar a c\xE2mera ou carregar o reconhecimento. Use toque, mouse ou teclado.";
    }
  }
  function initAccessibility() {
    apply();
    render();
    $("#access-open").onclick = () => {
      render();
      $("#access-panel").showModal();
    };
    document.addEventListener("click", async (event) => {
      const b = event.target.closest("button");
      if (!b) return;
      if (b.hasAttribute("data-access-close")) $("#access-panel").close();
      if (b.hasAttribute("data-access-size")) {
        const change = Number(b.dataset.accessSize);
        prefs.size = change ? Math.min(200, Math.max(80, prefs.size + change)) : 100;
        apply();
        $("#font-percent").textContent = prefs.size + "%";
      }
      if (b.hasAttribute("data-access-reset")) {
        prefs = { ...defaults };
        apply();
        render();
        stopGesture();
        $("#camera-indicator")?.remove();
        window.speechSynthesis?.cancel();
        toast("Configura\xE7\xF5es restauradas.");
      }
      if (b.dataset.speech) {
        if (!("speechSynthesis" in window)) {
          toast("Leitura em voz n\xE3o dispon\xEDvel neste navegador.");
          return;
        }
        const synth = window.speechSynthesis;
        if (b.dataset.speech === "read") {
          synth.cancel();
          const text = $("#main").innerText;
          const chunks = text.match(/[^.!?\n]+[.!?\n]?/g) || [text];
          for (const c of chunks) {
            const u = new SpeechSynthesisUtterance(c);
            u.lang = state.language;
            synth.speak(u);
          }
        }
        if (b.dataset.speech === "pause") synth.pause();
        if (b.dataset.speech === "resume") synth.resume();
        if (b.dataset.speech === "stop") synth.cancel();
      }
      if (b.hasAttribute("data-vlibras")) {
        const status = $("#vlibras-status");
        status.textContent = "Carregando VLibras\u2026";
        try {
          if (!window.VLibras) {
            await new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.src = "https://vlibras.gov.br/app/vlibras-plugin.js";
              script.onload = resolve;
              script.onerror = reject;
              document.head.append(script);
              setTimeout(() => reject(new Error("timeout")), 15e3);
            });
          }
          if (!document.querySelector("[vw]")) {
            const node = document.createElement("div");
            node.setAttribute("vw", "");
            node.className = "enabled";
            node.innerHTML = '<div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>';
            document.body.append(node);

          $("#access-panel").close();
        } catch {
          status.textContent = "VLibras indispon\xEDvel no momento. Tente novamente mais tarde.";
        }
      }
      if (b.dataset.gesture === "start") await startGesture();
      if (b.dataset.gesture === "stop") {
        stopGesture();
        $("#camera-indicator")?.remove();
      }
    });
    document.addEventListener("change", (event) => {
      const k = event.target.dataset.accessPref;
      if (k) {
        prefs[k] = event.target.checked;
        apply();
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopGesture();
        $("#camera-indicator")?.remove();
      }
    });
    window.addEventListener("pagehide", () => {
      stopGesture();
      window.speechSynthesis?.cancel();
    });
  }

  const demo = {step: 1, address: {}, method: 'pix', completed: false};
  let pendingPix = load('ecopet-pix-clock', null);
  let demoOrders = load('ecopet-demo-orders', []);
  if (!Array.isArray(demoOrders)) demoOrders = [];
  const demoNotice = '';
  function demoTotals() {
    const subtotal = state.cart.reduce((sum, item) => sum + (state.products.find(p => p.id === item.id)?.price || 0) * item.quantity, 0);
    const used = state.user && demoOrders.some(o => o.customer === state.user.name);
    const discount = safeSession.getItem('ecopet-coupon') === 'CUPETE10' && !used ? Math.round(subtotal * .1) : 0;
    return {subtotal, discount, shipping: subtotal ? 1500 : 0, total: subtotal - discount + (subtotal ? 1500 : 0)};
  }
  function demoSummary() {
    const total = demoTotals();
    return `<aside class="panel summary"><h2>Resumo da compra</h2>${state.cart.map(i => {const p = state.products.find(p => p.id === i.id);return `<p>${i.quantity} × ${e(p.name)} <strong>${money(p.price * i.quantity)}</strong></p>`;}).join('')}<div class="total-line"><span>Subtotal</span><strong>${money(total.subtotal)}</strong></div><div class="total-line"><span>Desconto CUPETE10</span><strong>− ${money(total.discount)}</strong></div><div class="total-line"><span>Frete fixo</span><strong>${money(total.shipping)}</strong></div><div class="total-line big"><span>Total</span><strong>${money(total.total)}</strong></div></aside>`;
  }
  function demoCheckout() {
    if(pendingPix && pendingPix.owner === state.user?.name && pendingPix.cart === JSON.stringify(state.cart)) {demo.step=4;demo.method='pix';}
    if(demo.step===4 && demo.method==='pix' && state.user && state.cart.length) {
      if(!pendingPix || pendingPix.owner!==state.user.name || pendingPix.cart!==JSON.stringify(state.cart)) {
        pendingPix={owner:state.user.name,cart:JSON.stringify(state.cart),deadline:Date.now()+60000};
        save('ecopet-pix-clock',pendingPix);
      }
    }

    if (!state.cart.length) return `<section class="container section"><h1>Seu carrinho está vazio</h1><a class="btn" href="#/produtos">Explorar produtos</a></section>`;
    if (!state.user) return `<section class="container section"><h1>Finalização da compra</h1>${demoNotice}<div class="panel"><h2>Identifique-se para continuar</h2><p>Seu carrinho será preservado.</p><a class="btn" href="#/cadastro">Criar conta</a> <a class="btn secondary" href="#/login">Entrar</a></div></section>`;
    let content;
    if (demo.step === 1) content = `<form id="demo-address" class="panel form" autocomplete="off"><h2>Endereço de entrega</h2><p>Olá, ${e(state.user.name)}. Informe o endereço de entrega.</p>${field('CEP','cep','text',demo.address.cep || '', 'required inputmode="numeric" pattern="[0-9]{5}-?[0-9]{3}" placeholder="00000-000"')}${field('Rua','street','text',demo.address.street || '', 'required maxlength="100"')}${field('Número','number','text',demo.address.number || '', 'required maxlength="10"')}${field('Complemento','extra','text',demo.address.extra || '', 'maxlength="60"')}${field('Bairro','district','text',demo.address.district || '', 'required maxlength="60"')}${field('Cidade','city','text',demo.address.city || '', 'required maxlength="60"')}${field('Estado (UF)','uf','text',demo.address.uf || '', 'required pattern="[A-Za-z]{2}" maxlength="2"')}${errorBox()}<button class="btn">Continuar para entrega</button></form>`;
    if (demo.step === 2) content = `<div class="panel"><h2>Entrega</h2><p>${e(demo.address.street)}, ${e(demo.address.number)} · ${e(demo.address.city)} / ${e(demo.address.uf)} · CEP ${e(demo.address.cep)}</p><div class="notice"><strong>Frete fixo: R$ 15,00</strong><p>Entrega com frete fixo de R$ 15,00.</p></div><div class="buttons"><button class="btn secondary" data-demo-step="1">Voltar</button><button class="btn" data-demo-step="3">Revisar compra</button></div></div>`;
    if (demo.step === 3) content = `<div class="panel"><h2>Revisão</h2><p>Confira os produtos, o desconto e o frete no resumo.</p><p>Destino: ${e(demo.address.street)}, ${e(demo.address.number)} · ${e(demo.address.city)}/${e(demo.address.uf)} · ${e(demo.address.cep)}</p><div class="buttons"><button class="btn secondary" data-demo-step="2">Voltar</button><button class="btn" data-demo-step="4">Escolher pagamento</button></div></div>`;
    if (demo.step === 4) content = `<div class="panel payment-panel"><div class="payment-heading"><div><span class="eyebrow">ÚLTIMA ETAPA</span><h2>Como você quer pagar?</h2></div><div class="payment-total"><span>Total com frete</span><strong>${money(demoTotals().total)}</strong></div></div><div class="payment-methods" role="group" aria-label="Forma de pagamento"><button class="btn ${demo.method === 'pix' ? '' : 'secondary'}" data-demo-method="pix" aria-pressed="${demo.method === 'pix'}"><strong>Pix</strong><small>QR Code e confirmação automática</small></button><button class="btn ${demo.method === 'card' ? '' : 'secondary'}" data-demo-method="card" aria-pressed="${demo.method === 'card'}"><strong>Cartão</strong><small>Preencha e finalize a compra</small></button></div>${demo.method === 'pix' ? `<div class="pix-panel"><h3>Pagamento via Pix</h3><figure style="margin:20px auto;max-width:240px"><img src="assets/pix-ilustrativo.svg" alt="QR Code da apresentação EcoPet" width="240" height="240" style="display:block;width:100%;height:auto;background:white;border-radius:12px"></figure><p>Total a pagar</p><strong style="font-size:2rem">${money(demoTotals().total)}</strong><p role="status">Aguardando confirmação</p><strong id="pix-countdown" role="timer" style="font-size:2rem">01:00</strong><p>É só aguardar. Ao terminar a contagem,<br>seu pedido abre automaticamente.</p></div>` : `<form id="demo-card" class="form" autocomplete="off"><h3>Cartão de crédito</h3>${field('Nome no cartão','holder','text','CLIENTE TESTE','required maxlength="60"')}${field('Número do cartão','card','text','4111 1111 1111 1111','required inputmode="numeric" maxlength="19" autocomplete="off"')}<div class="card-short-fields">${field('Validade','expiry','text','12/30','required inputmode="numeric" maxlength="5" placeholder="MM/AA" autocomplete="off"')}${field('Código de segurança','cvv','password','123','required inputmode="numeric" maxlength="3" autocomplete="off"')}</div><p>1x de ${money(demoTotals().total)}, sem juros.</p>${errorBox()}<button class="btn pay-submit">Finalizar compra · ${money(demoTotals().total)}</button></form>`}<div class="buttons" style="margin-top:20px"><button class="btn secondary" data-demo-step="3">Voltar à revisão</button></div></div>`;
    return `<section class="container section checkout-page"><h1>Finalização da compra</h1>${demoNotice}<ol class="steps">${['Identificação','Endereço','Entrega','Revisão','Pagamento','Confirmação'].map((s,i)=>`<li ${i === demo.step ? 'aria-current="step"' : ''}>${i+1}. ${s}</li>`).join('')}</ol><div class="cart-layout">${content}${demo.step === 4 ? `<details class="payment-summary"><summary>Conferir itens, desconto e frete</summary>${demoSummary()}</details>` : demoSummary()}</div></section>`;
  }
  function demoOrderPage(id) {
    const mine = demoOrders.filter(o => o.customer === state.user?.name);
    if (id) {
      const order = mine.find(o => o.id === id);
      if (!order) return '<section class="container section"><h1>Pedido não encontrado nesta conta</h1><a href="#/pedidos">Meus pedidos</a></section>';
      return `<section class="container section"><img src="assets/logo-ecopet.png" alt="EcoPet" width="110"><h1>Acompanhe seu pedido</h1>${demoNotice}<div class="panel"><h2>${e(order.id)}</h2><p>${date(order.created)} · ${order.method === 'pix' ? 'Pix' : 'Cartão'} · Pagamento aprovado</p>${order.items.map(i=>`<p>${i.quantity} × ${e(i.name)} — ${money(i.price * i.quantity)}</p>`).join('')}<p>Subtotal: ${money(order.subtotal)} · Desconto: ${money(order.discount)} · Frete: ${money(order.shipping)}</p><h3>Total: ${money(order.total)}</h3>${demoTracking(order)}</div><div class="buttons"><a class="btn" href="#/pedidos">Meus pedidos</a><a class="btn secondary" href="#/produtos">Continuar comprando</a></div></section>`;
    }
    return `<section class="container section"><h1>Meus pedidos</h1>${demoNotice}${mine.length ? mine.map(o=>`<article class="panel"><h2>${e(o.id)}</h2><p>${date(o.created)} · ${money(o.total)} · ${e(o.timeline?.at(-1)?.label || "Pedido recebido")}</p><a class="btn secondary" href="#/pedido/${encodeURIComponent(o.id)}">Ver pedido</a></article>`).join('') : '<div class="empty">Você ainda não fez pedidos.</div>'}</section>`;
  }
  const demoStages = ['Pedido recebido','Pagamento aprovado','Em preparação','Embalado','Enviado','Saiu para entrega','Entregue'];
  function demoTracking(order) {
    refreshTracking(order);
    const timeline = order.timeline;
    const current = timeline.length - 1;
    return `<h3>Atualizações do pedido</h3><p role="status"><strong>${e(timeline[current].label)}</strong></p>
      <ol class="demo-timeline">${demoStages.map((label,i)=>`<li ${i===current ? 'aria-current="step"' : ''}><strong>${i <= current ? '✓' : '○'} ${e(label)}</strong><small>${timeline[i] ? date(timeline[i].at) : 'Aguardando'}</small></li>`).join('')}</ol>
      <p>${current === 6 ? 'Pedido entregue. Obrigado por escolher a EcoPet!' : current >= 4 ? 'Seu pedido está a caminho.' : 'Estamos cuidando do seu pedido.'}</p>`;
  }
  // Cronologia automática de apresentação, sem eventos de transportadora.
  function refreshTracking(order) {
    if (!order.autoTracking) return;
    const created = Date.parse(order.created);
    const count = Math.min(7, 2 + Math.floor(Math.max(0, Date.now()-created)/60000));
    order.timeline ||= [];
    while(order.timeline.length < count) {
      const i=order.timeline.length;
      order.timeline.push({label:demoStages[i],at:new Date(created+Math.max(0,i-1)*60000).toISOString()});
    }
    save('ecopet-demo-orders',demoOrders);
  }
  async function finishDemo(method) {
    if (demo.completed || !state.user || !state.cart.length || demo.step !== 4) return;
    demo.completed = true;
    save('ecopet-pix-clock', null);pendingPix=null;
    const order = {autoTracking:true, timeline: [{label:'Pedido recebido', at:new Date().toISOString()}, {label:'Pagamento aprovado', at:new Date().toISOString()}], id: 'DEMO-' + Date.now().toString(36).toUpperCase(), customer: state.user.name, created: new Date().toISOString(), method, ...demoTotals(), items: state.cart.map(i=>{const p=state.products.find(p=>p.id===i.id);return {name:p.name,price:p.price,quantity:i.quantity};})};
    demoOrders.unshift(order);
    save('ecopet-demo-orders',demoOrders);
    state.cart=[];persistCart();safeSession.removeItem('ecopet-coupon');
    demo.address={};demo.step=1;
    toast('Pagamento aprovado! Seu pedido foi registrado.',true);
    location.hash='/pedido/'+order.id;
  }
  document.addEventListener('click', async event => {
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.demoStep){demo.step=Number(button.dataset.demoStep);if(demo.step<4){pendingPix=null;save('ecopet-pix-clock',null);}await route();}
    if(button.dataset.demoMethod){demo.method=button.dataset.demoMethod;if(demo.method==='card'){pendingPix=null;save('ecopet-pix-clock',null);}await route();}

  });

  // Clock and order progression run locally; there is no payment confirmation service.
  setInterval(async () => {
    const timer = $('#pix-countdown');
    if(timer && pendingPix && pendingPix.owner===state.user?.name && pendingPix.cart===JSON.stringify(state.cart)) {
      const remaining=Math.max(0,Math.ceil((pendingPix.deadline-Date.now())/1000));
      timer.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
      if(remaining===0) await finishDemo('pix');
    }
    const match=location.hash.match(/^#\/pedido\/(.+)$/);
    if(match){const order=demoOrders.find(o=>o.id===match[1] && o.customer===state.user?.name);
      if(order){const before=order.timeline?.length;refreshTracking(order);if(order.timeline?.length!==before){toast('Atualização do pedido: '+order.timeline.at(-1).label,true);await route();}}
    }
  },1000);

  // Solicitações EcoTroca: nenhuma transmissão ocorre sem destino configurado.
  let ecoPhotoUrls = [];
  function ecoTrocaPage() {
    ecoPhotoUrls.forEach(url=>URL.revokeObjectURL(url));ecoPhotoUrls=[];
    return `<section class="container section ecotroca-page"><span class="eyebrow">PROJETO ECOTROCA</span><h1>Seu produto pode ganhar<br>uma nova história.</h1><p class="lead">Envie os detalhes e fotos do seu produto EcoPet. Vamos avaliar se ele está em condições de voltar para ser reaproveitado.</p><div class="ecotroca-layout"><div><div class="panels"><article class="panel"><span class="eyebrow">01</span><h3>Conte para a gente</h3><p>Informe o produto comprado e mostre como ele está hoje.</p></article><article class="panel"><span class="eyebrow">02</span><h3>Aguarde a avaliação</h3><p>A equipe verifica as fotos e orienta sobre a possibilidade de devolução.</p></article><article class="panel"><span class="eyebrow">03</span><h3>Ganhe um benefício</h3><p>Produtos aprovados podem render até 10% de desconto, conforme o produto e suas condições.</p></article></div>
      <form id="ecotroca-form" class="panel form" style="margin-top:24px"><h2>Solicitar avaliação</h2><p>Preencha seus dados de contato e as informações do produto.</p><div class="ecotroca-fields">${field('Nome completo','name','text','','required autocomplete="name" maxlength="100"')}${field('E-mail','email','email','','required autocomplete="email" maxlength="254"')}${field('Telefone / WhatsApp','phone','tel','','required autocomplete="tel" inputmode="tel" minlength="10" maxlength="20"')}${field('Cidade e estado','city','text','','required maxlength="100"')}</div><h3>Sobre a sua compra</h3><label class="field">Produto comprado<select name="product" required><option value="">Selecione o produto</option>${state.products.map(p=>`<option value="${e(p.id)}">${e(p.name)}</option>`).join('')}</select></label><div class="ecotroca-fields">${field('Número do pedido (se tiver)','order','text','','maxlength="60"')}${field('Data aproximada da compra (opcional)','purchaseDate','date','','max="'+new Date().toISOString().slice(0,10)+'"')}</div><label class="field">Como está o produto?<select name="condition" required><option value="">Selecione uma opção</option><option>Pouco usado</option><option>Usado, com sinais de desgaste</option><option>Danificado ou com partes faltando</option><option>Outro estado</option></select></label><label class="field">Conte mais sobre as condições<textarea name="description" required minlength="10" maxlength="2000" rows="5" placeholder="Descreva o desgaste, partes soltas ou faltantes e o que você gostaria de devolver."></textarea></label><label class="field">Fotos atuais do produto<input type="file" id="ecotroca-photos" name="photos" accept="image/jpeg,image/png,image/webp" multiple required aria-describedby="ecotroca-photo-help"></label><small id="ecotroca-photo-help">Escolha de 1 a 3 fotos em JPG, PNG ou WebP, com até 5 MB cada. Fotografe o produto inteiro e os detalhes do desgaste; evite incluir pessoas ou documentos.</small><div id="ecotroca-previews" class="ecotroca-previews"></div><label class="check"><input type="checkbox" name="consent" required>Autorizo o uso dos dados e fotos enviados para avaliar esta solicitação e entrar em contato comigo sobre a EcoTroca.</label><p class="muted">O envio não garante a aceitação da devolução nem um desconto de 10%. Aguarde a avaliação antes de enviar o produto.</p>${errorBox()}<button class="btn">Revisar solicitação</button></form><div id="ecotroca-review" aria-live="polite"></div></div><aside class="panel ecotroca-benefit"><span class="eyebrow">CUIDADO QUE CONTINUA</span><h2>Até 10%<br>de desconto</h2><p>O benefício depende do produto, das condições de reaproveitamento e da aprovação da equipe.</p><img src="assets/embalagens-novas.jpeg" alt="Referência de embalagens EcoPet" style="width:100%;border-radius:14px" loading="lazy"><h3>O que acontece depois?</h3><p>A EcoPet entra em contato para informar o resultado da análise e, se aprovado, as orientações de devolução e o benefício disponível.</p></aside></div></section>`;
  }
  function validateEcoPhotos(files) {
    if(files.length<1 || files.length>3) throw new Error('Escolha de 1 a 3 fotos do produto.');
    for(const f of files) if(!['image/jpeg','image/png','image/webp'].includes(f.type) || f.size>5*1024*1024 || f.size===0) throw new Error('Use fotos JPG, PNG ou WebP com até 5 MB cada.');
  }
  document.addEventListener('change', event=>{
    if(event.target.id!=='ecotroca-photos')return;
    const form=event.target.form;form.querySelector('[data-error]').textContent='';
    ecoPhotoUrls.forEach(url=>URL.revokeObjectURL(url));ecoPhotoUrls=[];
    $('#ecotroca-previews').replaceChildren();$('#ecotroca-review').replaceChildren();
    try {
      const files=Array.from(event.target.files);validateEcoPhotos(files);
      for(const f of files){const url=URL.createObjectURL(f);ecoPhotoUrls.push(url);const img=document.createElement('img');img.src=url;img.alt='Foto selecionada do produto: '+f.name;$('#ecotroca-previews').append(img);}
    }catch(error){event.target.value='';setError(form,error);}
  });

  boot();
})();

document.querySelector(".skip").addEventListener("click", function(event) { event.preventDefault(); document.getElementById("main").focus(); });
</script>
</body>
</html>
